name: 新想法 / Feature Idea
description: 提议新能力、机器或改进 / Propose a new ability, machine or improvement
labels: ["enhancement"]
body:
  - type: input
    id: title
    attributes:
      label: 想法名称 / Idea
      placeholder: "例如：暗物质 Dark Matter"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / Why
      description: 为什么需要它？解决什么痛点或使用场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案设想 / Proposed approach
      description: 你设想如何实现？是否对标原版 1.12.2 的某项内容？
  - type: dropdown
    id: scope
    attributes:
      label: 范围 / Scope
      options:
        - "新能力 / New ability"
        - "新机器 / New machine"
        - "系统/框架 / System or framework"
        - "UI/特效/本地化 / UI, effect or localization"
        - "其它 / Other"
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 参与 / Involvement
      options:
        - label: "我愿意认领并实现这个想法 / I'd like to implement it"
