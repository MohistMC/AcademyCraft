name: Bug 报告 / Bug Report
description: 报告一个可复现的问题 / Report a reproducible problem
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 模组版本 / Mod version
      description: 例如 1.1.7（1.21.1）
      placeholder: "1.1.7"
    validations:
      required: true
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft 版本 / Minecraft version
      options:
        - "1.21.1"
        - "1.12.2 (legacy)"
        - "其它 / Other"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 涉及能力丢失/网络问题请务必选"跨服"
      options:
        - "单人 / Single player"
        - "多人-开服端 / Dedicated server"
        - "多人-客户端 / Multiplayer client"
        - "跨服 (BungeeCord/Velocity) / Cross-server"
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 问题描述 / Description
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 粘贴最新错误日志，建议使用 https://mclo.gs 或 paste 网站，不要直接截图长文本
      render: shell
