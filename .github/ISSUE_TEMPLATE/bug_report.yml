name: Bug report
description: Report a bug in AcademyCraft
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: branch
    attributes:
      label: Which branch / version are you using?
      description: The 1.21.1 line is a NeoForge rewrite still in development (v0.0.1). The 1.12.2 line is the stable release (1.1.6).
      options:
        - "1.21.1 (NeoForge, in development)"
        - "1.12.2 (Forge, stable 1.1.6)"
        - "Other / not sure"
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: "e.g. 1.21.1"
    validations:
      required: true
  - type: input
    id: loader-version
    attributes:
      label: NeoForge / Forge version
      placeholder: "e.g. 21.1.232"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Use ability ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / crash report
      description: Drag & drop or paste the latest.log / crash report. Avoid screenshots of text.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this bug is not already reported.
          required: true
