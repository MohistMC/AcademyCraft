name: Java CI with Gradle

on:
  push:
    branches: [ "1.21.1" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "1.21.1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Setup Gradle
      run: chmod +x ./gradlew
    - name: Build with Gradle Wrapper
      run: ./gradlew build
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: AcademyCraft-1.21.1-dev
        path: build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Setup Gradle
      run: chmod +x ./gradlew
    - name: Build with Gradle Wrapper
      run: ./gradlew build
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
        generate_release_notes: true
